services:
  postgres:
    image: postgres:16-alpine
    container_name: 42chat-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: banana42
      POSTGRES_DB: chat
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./internal/db/migrations:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - 42chat

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 42chat-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://chat:banana42@postgres:5432/chat?sslmode=disable
      JWT_SECRET: dev-secret-change-in-production
      DEV_MODE: "true"
      FORTYTWO_CLIENT_ID: "${FORTYTWO_CLIENT_ID:-}"
      FORTYTWO_CLIENT_SECRET: "${FORTYTWO_CLIENT_SECRET:-}"
      FORTYTWO_API_URL: "https://api.intra.42.fr"
    networks:
      - 42chat

volumes:
  pgdata:
    driver: local

networks:
  42chat:
    driver: bridge
